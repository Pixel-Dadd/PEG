name: usdt-watch
on:
  schedule:
    - cron: "*/10 * * * *"   # каждые 10 минут (GitHub может запускать с опозданием)
  workflow_dispatch: {}        # кнопка ручного запуска
permissions:
  contents: write
concurrency:
  group: usdt-watch
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Проверка
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT: ${{ secrets.TG_CHAT }}
        run: python watch_once.py
      - name: Сохранить состояние и лог
        run: |
          git config user.name "usdt-watch"
          git config user.email "usdt-watch@users.noreply.github.com"
          git add state.json log.csv
          git commit -m "check $(date -u +%H:%M)" || exit 0
          git push
